version: "2"

run:
  timeout: 10m

linters:
  enable:
    - errcheck
    - revive
    - govet
    - staticcheck
    - misspell
    - gocritic
    - sqlclosecheck
    - rowserrcheck
    - nilerr
    - godot
    - forbidigo
    - mirror
    - bodyclose
  settings:
    revive:
      # Run entire rule set and selectively disable the ones that are too strict for now.
      enable-all-rules: true
      rules:
        - name: file-header
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: function-length
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: function-result-limit
          disabled: true
        - name: banned-characters
          disabled: true
        - name: argument-limit
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: confusing-results
          disabled: true
        - name: add-constant
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: nested-structs
          disabled: true
        - name: import-shadowing
          disabled: true
        - name: early-return
          disabled: true
        - name: use-any
          disabled: true
        - name: exported
          disabled: true
        - name: unhandled-error
          disabled: true
        - name: if-return
          disabled: true
        - name: max-control-nesting
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
      settings:
        printf:
          funcs:
            - common.Errorf
    forbidigo:
      forbid:
        - pattern: 'fmt\\.Errorf(# Please use errors\\.Wrap\\|Wrapf\\|Errorf instead)?'
        - pattern: 'ioutil\\.ReadDir(# Please use os\\.ReadDir)?'

formatters:
  enable:
    - goimports
  settings:
    goimports:
      # Keep local modules grouped after 3rd-party imports.
      local-prefixes:
        - github.com/usememos/memos
